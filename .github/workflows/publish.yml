name: Publier Laméssin

# Ce dépôt est rempli automatiquement depuis le dépôt source privé.
# Il construit les installeurs ordinateur, crée la version téléchargeable,
# puis publie le site et le fichier version.json lu par l'application pour proposer les mises à jour.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  desktop:
    name: Ordinateur (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Numéro de version
        shell: bash
        run: node -e 'const v=require("./version.json");require("fs").writeFileSync("www/js/version.js","window.DDC_BUILD={code:"+v.code+",version:"+JSON.stringify(v.version)+"};\n")'
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg

  release:
    name: Version téléchargeable
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        run: echo "VER=$(node -p 'require("./version.json").version')" >> $GITHUB_ENV
      - run: cp apk/DDC-Core.apk out/ && ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Laméssin ${{ env.VER }}
          make_latest: true
          files: out/*
          body: |
            ## Télécharger Laméssin ${{ env.VER }}

            - **Android** : `DDC-Core.apk`. Si Laméssin est déjà installé, il se met à jour par-dessus, sans désinstaller.
            - **Windows** : `DDC-Core-Setup.exe`. Si Windows affiche un avertissement : « Informations complémentaires » puis « Exécuter quand même ».
            - **Linux** : `DDC-Core.AppImage`. Rends-le exécutable puis lance-le.
            - **Mac** : `DDC-Core.dmg`. La première fois : clic droit sur l'application puis « Ouvrir ».

            Version web : https://grace-shop.github.io/ddc-core-app/

            Laméssin donne des conseils de premiers soins et ne remplace pas un professionnel de santé.
      - name: Garder seulement les 3 dernières versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R ${{ github.repository }} --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while read t; do gh release delete "$t" -R ${{ github.repository }} --yes --cleanup-tag || true; done

  pages:
    name: Site web
    needs: release
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir site && cp -r www/. site/ && cp apk/DDC-Core.apk version.json site/
          node -e 'const v=require("./version.json");require("fs").writeFileSync("site/js/version.js","window.DDC_BUILD={code:"+v.code+",version:"+JSON.stringify(v.version)+"};\n")'
          cat site/js/version.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
